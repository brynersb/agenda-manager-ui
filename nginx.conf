# Configuração do nginx da UI (modo demonstração). Vira um "template": a
# imagem substitui ${CSP_CONNECT_SRC} na subida do contêiner.

# Cache por caminho. Mapa num lugar só (em vez de add_header por location)
# porque um add_header dentro de `location` descartaria os cabeçalhos de
# segurança definidos no nível do `server`.
#   /assets/*  -> nome com hash do Vite: cache imutável por 1 ano
#   o resto    -> `index.html` (e as rotas da SPA, que caem nele) sem cache
map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Scripts só da própria origem. Estilos: arquivos da própria origem, mais
  # `'unsafe-inline'` por causa do Radix UI (Dialog/Select/Dropdown), que ao
  # travar a rolagem da página injeta um <style> em tempo de execução
  # (react-remove-scroll-bar). Sem isso o navegador bloqueia o estilo e o
  # painel lateral deixa a página rolar por trás. Não dá para usar hash (o
  # texto varia com a largura da barra de rolagem) nem nonce (o Vite entrega
  # HTML estático). Fontes e imagens são empacotadas no build (imagens pequenas
  # podem virar data URI). `connect-src` precisa da API e do Keycloak, que
  # ficam em outras portas.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' ${CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $cache_control always;

  # Fallback da SPA: rota desconhecida devolve o index.html e o roteador do
  # React decide. Arquivo estático inexistente em /assets/ deve dar 404 de
  # verdade (senão o navegador receberia HTML no lugar de JS).
  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
