# Stack do modo demonstração local: Postgres, API e UI já buildados, com dados
# em um volume nomeado que sobrevive a reinícios. A autenticação é própria da
# API (ADR-016): não há provedor de identidade externo para subir.
#
# Use os scripts `npm run demo:*` (eles já passam `-p pauta-demo -f ...` e o
# `demo/.env`, que o `demo:up` gera na primeira execução).
# Direto: docker compose -p pauta-demo -f demo/compose.demo.yaml \
#           --env-file demo/.env up -d --build --wait
#
# Portas no host (coexiste com a stack de desenvolvimento, que usa 5433 e
# 3000):
#   UI 5173 | API 3001 | Postgres: não publicado (backup e restore por
#   `docker compose exec`).
# A UI precisa ficar na 5173 porque é a única origem liberada no CORS da API.
# Pare o `npm run dev` antes de subir a demonstração.
#
# Como o navegador fala com a API: DIRETO, em http://localhost:3001 (o nginx da
# UI só serve os arquivos estáticos, não faz proxy). Por isso a API libera a
# origem da UI em CORS_ORIGINS, a UI libera a API em `connect-src` da CSP e o
# `TRUST_PROXY` fica no padrão (false): não há proxy na frente da API, e confiar
# em `X-Forwarded-For` sem proxy deixaria o cliente forjar o IP.
#
# SEGREDOS: JWT_SECRET e a senha do administrador inicial vêm do `demo/.env`
# (gerado com valores aleatórios, ignorado pelo git). A senha do Postgres abaixo
# é um valor FIXO DE DEMONSTRAÇÃO: o banco só existe na rede interna do
# compose, sem porta publicada.
name: pauta-demo

x-api-dir: &api-dir ${PAUTA_API_DIR:-../../pauta-mkt-api}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pauta
      POSTGRES_USER: pauta
      # Valor de demonstração (não é segredo real); a porta não é publicada.
      POSTGRES_PASSWORD: pauta
    volumes:
      # Postgres 18+ guarda os dados num subdiretório versionado de /var/lib/postgresql.
      - pauta-demo-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pauta -d pauta"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: *api-dir
    image: pauta-demo-api:local
    environment:
      NODE_ENV: production
      # `demo` = stack completa: exige JWT_SECRET e CORS_ORIGINS e libera o
      # `seed:dev` (usuários dev.* com a senha pública de desenvolvimento).
      STAGE: demo
      PORT: "3000"
      # O entrypoint da imagem aplica as migrations antes de subir a API; se
      # falharem, o contêiner sai com erro e a API não sobe.
      RUN_MIGRATIONS: "true"
      # Postgres da própria stack (rede interna do compose; TLS desligado).
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: pauta
      DATABASE_PASS: pauta
      DATABASE_NAME: pauta
      DATABASE_SSL: "false"
      # A UI chama a API direto do navegador: libera só a origem da UI.
      CORS_ORIGINS: http://localhost:5173
      SWAGGER_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?rode `npm run demo:up` para gerar o demo/.env}
      # Administrador inicial: só é criado se a tabela de usuários estiver
      # vazia, com troca de senha obrigatória no primeiro login.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?rode `npm run demo:up` para gerar o demo/.env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?rode `npm run demo:up` para gerar o demo/.env}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      # Folga para as migrations da primeira subida.
      start_period: 15s
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # As VITE_* são gravadas no bundle: valem para o navegador, por isso
        # apontam para a porta publicada no host, não para a rede interna.
        VITE_API_BASE_URL: http://localhost:3001/api/v1/
        VITE_UI_THEME: ${VITE_UI_THEME:-soft}
        VITE_FORM_PRESENTATION: ${VITE_FORM_PRESENTATION:-modal}
    image: pauta-demo-ui:local
    environment:
      # Origem liberada no `connect-src` da CSP: a API.
      CSP_CONNECT_SRC: http://localhost:3001
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  # Nome fixo (sem o prefixo do projeto): `docker volume ls` mostra
  # exatamente `pauta-demo-pgdata`.
  pauta-demo-pgdata:
    name: pauta-demo-pgdata
